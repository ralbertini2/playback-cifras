<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>Playback Cifras</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <h1>Playback Cifras</h1>
        <p>PDF + MP3 sincronizados por música</p>
      </div>
      <div class="search-box">
        <input id="searchInput" type="search" placeholder="Buscar música..." autocomplete="off" />
      </div>
      <ol class="song-list" id="songList"></ol>
    </aside>

    <section class="stage">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn" aria-label="Abrir lista">☰</button>
        <div class="song-info">
          <strong id="songTitle">Carregando...</strong>
          <span id="songCounter"></span>
        </div>
        <button id="fullscreenBtn" class="small-btn">Tela cheia</button>
      </header>

      <section class="viewer-wrap">
        <iframe id="pdfViewer" class="pdf-viewer" title="Visualizador da cifra em PDF"></iframe>
      </section>

      <footer class="player-bar">
        <button id="prevBtn" class="nav-btn">← Anterior</button>
        <audio id="audioPlayer" controls preload="metadata"></audio>
        <button id="nextBtn" class="nav-btn">Próxima →</button>
      </footer>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
